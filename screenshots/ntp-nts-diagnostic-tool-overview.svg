<text x="40" y="680" class="h2">Key features</text><text x="40" y="708" class="s">RFC 8915 NTS • TLS 1.3 • authenticated NTP • certificate validation • file logging • Copy/Clear Log • stability testing</text><text x="40" y="735" class="s">Protocol diagnostics and interoperability testing — not a substitute for NIC hardware timestamp measurements.</text></svg>