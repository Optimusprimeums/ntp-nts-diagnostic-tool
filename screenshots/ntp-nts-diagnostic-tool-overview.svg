<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17365d}.h1{font-size:40px;font-weight:700}.h2{font-size:21px;font-weight:600}.t{font-size:16px;fill:#202124}.s{font-size:14px;fill:#202124}.m{font:13px Consolas,monospace;fill:#e8e8e8}.call{fill:#e8f3ff;stroke:#1976d2}.line{stroke:#1976d2;stroke-width:2}.ui{fill:#fff;stroke:#718096;stroke-width:2}.panel{fill:#f5f6f7;stroke:#c8ccd0}.log{fill:#1f1f1f}.btn{fill:#e9ecef;stroke:#9aa0a6}.blue{fill:#1976d2}.white{fill:#fff}</style>
